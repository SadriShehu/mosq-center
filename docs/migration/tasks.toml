[[task]]
ref = "embed"
title = "Serve web/out from Go; Docker + Makefile + CI"
owner = "backend"
after = ["merge-1"]
body = """
First: git merge feat/nextjs-migration.
- web/embed.go: //go:embed all:out (package web). Go handler: /x -> x.html, / -> index.html,
  /_next/static/* with Cache-Control immutable, unknown -> 404.html. Keep the auth
  middleware on the admin page routes (redirect to /login as today). API routes untouched.
- Remove internal/templates and the HTML handlers (internal/handlers/templates.go) — the
  JSON API stays.
- Dockerfile: node stage builds web/out before go build. Makefile: `make web`, `make run` builds web first.
  A placeholder so `go build` works without a web build (document it).
- .github/workflows/pipeline.yml: on PRs run go vet/test + web lint/typecheck/build. Do not
  change the deploy jobs or Terraform.
Done when: docker build succeeds, and the container (PORT=8082, MONGO_COLLECTION_NAME=mosq_backend)
serves /, /lagjet and /api/v1/health. Paste curl -I outputs in the --note.
"""

