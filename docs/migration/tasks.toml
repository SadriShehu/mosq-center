# Board for team mosq-web. Spec for everything: docs/migration/PLAN.md

# ---------------- Wave 1: three tracks in parallel ----------------

[[task]]
ref = "api"
title = "Go API prep for the SPA (contract in PLAN.md)"
owner = "backend"
body = """
Implement every row of the 'API contract' table in docs/migration/PLAN.md:
- middleware: /api/* -> 401 JSON instead of redirect (page routes keep redirecting).
- GET /api/v1/me, GET /api/v1/public/prayers, GET /api/v1/regions.
- Move the join logic out of internal/handlers/templates.go into the services and expose
  GET /api/v1/payments/details, /api/v1/families/details, /api/v1/payments/no-payment/details.
  Missing family/neighbourhood -> empty name, never panic (templates.go:131,137 bug).
- Keep the old HTML handlers working for now (go-embed removes them later).
Tests: table-driven Go unit tests for the join functions (incl. missing family) and
httptest tests for the 401 behaviour and /me with auth disabled.
Done when: go vet ./... && go test ./... pass; curl each new endpoint on PORT=8082 and paste one sample response per endpoint in the --note.
"""

[[task]]
ref = "core"
title = "Scaffold web/ + layouts + shared components + typed API client"
owner = "web-core"
body = """
Create web/ per PLAN.md 'Architecture': Next.js App Router + TS, bootstrap + react-bootstrap,
fontawesome, TanStack Query, react-hook-form + zod. next.config: output 'export' only in
production; dev rewrites to API_ORIGIN. Scripts: dev, build, lint, typecheck.
Build:
- lib/api.ts + lib/types.ts: typed client for every endpoint the pages need (existing CRUD
  + the new contract rows). 401 -> window.location = '/login'.
- AppShell (sidebar + toggle + top nav + Shpalos dropdown) and PublicShell — exact texts from
  the 'Shared auth layout' paragraph. Port only the sidebar CSS rules.
- AuthGuard (calls /api/v1/me), Toast provider, ConfirmDialog, FormModal, DataTable with a
  text-search filter on a chosen column, PrayerGrid (7 cards, labels from PLAN.md), formatDate.
- Route stubs for /, /user, /lagjet, /familjet, /pagesat, /pagesat-pakryera that render the
  right shell + page heading, so page owners only fill them in.
- web/README.md: how to run dev against Go.
You code against the contract; the backend builds it in parallel. Do not edit Go code.
Done when: npm run lint && npm run typecheck && npm run build pass and `web/out` contains
lagjet.html etc.
"""

[[task]]
ref = "mig"
title = "Migration (parity) suite for all pages, green against the OLD app"
owner = "qa"
body = """
Set up e2e/ (own package.json, Playwright, chromium, BASE_URL env, html reporter).
Run the OLD app from `main` (see PLAN.md 'Local environment': git worktree add /tmp/mosq-old main;
PORT=8081 MONGO_COLLECTION_NAME=mosq_qa go run ./cmd).
Write e2e/migration/<page>.spec.ts for: layout nav, /, /user, /lagjet, /familjet, /pagesat,
/pagesat-pakryera — covering every 'Must keep' item in the parity table. Text/role/label
selectors only; each test seeds via /api/v1 with a unique suffix and cleans up.
Note: the old app has no JSON details endpoints — seed only with the existing CRUD endpoints.
Add e2e/README.md with the exact commands.
Done when: `BASE_URL=http://localhost:8081 npx playwright test migration` is fully green
(paste the summary line in the --note).
"""

[[task]]
ref = "rev-api"
title = "Review: api"
owner = "reviewer"
after = ["api"]
body = """
Review branch hive/mosq-web/backend vs feat/nextjs-migration (git diff feat/nextjs-migration...hive/mosq-web/backend).
Check: matches the contract table exactly (paths, JSON field names, status codes); no nil
panics; auth: /api/* without session -> 401, /api/v1/public/prayers works without session,
nothing else became public; tests cover the missing-family case; go vet/test pass.
Findings -> hive team say backend. Close only when approved.
"""

[[task]]
ref = "rev-core"
title = "Review: core"
owner = "reviewer"
after = ["core"]
body = """
Review hive/mosq-web/web-core vs feat/nextjs-migration.
Check: output 'export' only in production; rewrites cover /api, /login, /callback, /logout;
types match the PLAN.md contract field names (snake_case JSON); layout texts match the old
layout.html exactly; no vendored styles.css; no location.reload(); 401 -> /login; lint,
typecheck, build pass. Findings -> hive team say web-core. Close only when approved.
"""

[[task]]
ref = "rev-mig"
title = "Review: migration suite"
owner = "reviewer"
after = ["mig"]
body = """
Review hive/mosq-web/qa. Check: every 'Must keep' item in the PLAN.md parity table has an
assertion; no id/class/structure selectors; no assertions on raw date strings; tests seed +
clean up their own data and do not depend on order; nothing is skipped or marked fixme.
Findings -> hive team say qa. Close only when approved.
"""

[[task]]
ref = "merge-1"
title = "Lead: merge api + core + migration suite into feat/nextjs-migration"
owner = "lead"
after = ["rev-api", "rev-core", "rev-mig"]
body = "Merge the three branches, run go test + web build, then announce: everyone `git merge feat/nextjs-migration`."

