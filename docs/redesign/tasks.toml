git merge feat/nextjs-migration first. Build per UX.md 'Mbledhja' + the canvas mockups (desktop and phone):
neighbourhood picker, progress bar, tabs, search, one-tap Paguaj with undo toast (delete the created payment on undo),
multi-select + Shëno të paguara via /payments/bulk, Gjenero faturat (PDF; 404 -> sq message), sticky action bar on phones,
family name opens the family sheet (/familjet?id=). Data from /api/v1/collection.
Write e2e/specs/mbledhja.spec.ts (pay, undo, bulk, tabs, search, PDF) passing on desktop AND phone.
Done when: lint/typecheck/build pass and that spec is green on both projects.
"""

