# Redesign wave for team mosq-web. Spec: docs/redesign/UX.md (read it first; it replaces
# PLAN.md's 'keep every label' rule). Git rules, ports and DBs from docs/migration/PLAN.md still apply.

# ---------------- R1: no-regret foundations, start now ----------------

[[task]]
ref = "r-ux"
title = "Lead: UX sign-off from the user on the new screens (canvas)"
owner = "lead"
body = "Lead closes this when the user approves the Fillimi, Mbledhja and phone mockups on the design canvas. Page tasks wait for it."

[[task]]
ref = "r-api"
title = "API for the new UX: stats, collection, family history, bulk pay, recent; allowlist gate; FEE_PER_MEMBER"
owner = "backend"
body = """
Implement the 'API additions' table and its two bullets in docs/redesign/UX.md. JSON responses
(no plain text) for the new endpoints. Amounts are computed server-side from members x FEE_PER_MEMBER.
Admin gate becomes an allowlist of public paths (UX.md); add a table test listing public vs protected paths,
including /mbledhja and an unknown route.
Tests: table-driven service tests for stats/collection/history/bulk (incl. empty DB -> zeros/[] not null,
a family with no payments, a neighbourhood with no families), httptest for each handler.
Done when: go vet + go test pass; curl samples for each endpoint in the --note.
"""

[[task]]
ref = "r-found"
title = "Tailwind v4 + shadcn/ui foundation, direction-A tokens, new AppShell, sq.ts, Albanian errors, API client"
owner = "web-core"
body = """
Per docs/redesign/UX.md:
- Add Tailwind v4 + shadcn/ui (Radix) + lucide-react + sonner; next/font for Plus Jakarta Sans + Inter; tokens as CSS variables.
  Keep react-bootstrap installed for now so old pages still compile (removed in r-cleanup).
- New AppShell: dark sidebar (Fillimi, Mbledhja, Familjet, Lagjet, Pagesat) that becomes a drawer under 1024px;
  top bar with the shared year selector (?viti=, default current year), Ctrl/Cmd-K command search (families + pages),
  user menu (avatar + name -> Profili, Dil). PublicShell for /.
- Shared components in web/components/ui (shadcn) and web/components: Button, Input, Select, Dialog, Sheet,
  AlertDialog, Tabs, Badge (Paguar/Pa paguar), Progress, StatCard, EmptyState, Skeleton, DataTable that renders
  cards under 640px, Toaster with an undo action helper.
- web/lib/sq.ts with every string from the UX.md glossary; web/lib/format.ts money/date helpers (sq-AL, EUR).
- api.ts: Albanian error messages by status (UX.md), typed calls + types for every new endpoint in the API table.
- Route stub /mbledhja; /pagesat-pakryera redirects to /mbledhja keeping the query.
Done when: lint/typecheck/test/build pass; a short web/components/README.md lists the components and when to use them.
"""

[[task]]
ref = "r-qa-setup"
title = "e2e: retire migration suite to e2e/legacy, desktop + phone projects, new fixtures"
owner = "qa"
body = """
Move e2e/migration -> e2e/legacy (unchanged; excluded from the default run). Playwright projects 'desktop'
(1280x800) and 'phone' (390x844, isMobile, hasTouch). Fixtures in e2e/helpers: seed a neighbourhood, families
and payments through /api/v1 (unique suffix, cleanup), read /api/v1/stats for expected numbers once backend's
r-api lands (code against the UX.md API table now). Update e2e/README.md and the CI job if it runs e2e.
Done when: `npx playwright test --list` shows both projects; legacy suite still passes against the old commit
tag migration-parity when pointed at it (document how).
"""

[[task]]
ref = "r-rev-api"
title = "Review: r-api"
owner = "reviewer"
after = ["r-api"]
body = "Review hive/mosq-web/backend vs feat/nextjs-migration: matches the UX.md API table (paths, JSON fields, status codes), amounts server-side, no null lists, allowlist gate covers every public path and nothing else, tests cover empty DB and missing relations."

[[task]]
ref = "r-rev-found"
title = "Review: r-found"
owner = "reviewer"
after = ["r-found"]
body = "Review hive/mosq-web/web-core: tokens match UX.md, strings come from sq.ts with correct spelling, focus rings visible, 4.5:1 contrast, drawer/menu keyboard accessible, DataTable card mode under 640px, Albanian error mapping, no hardcoded fee."

[[task]]
ref = "r-merge-1"
title = "Lead: merge r-api + r-found + r-qa-setup (unblocks pages)"
owner = "lead"
after = ["r-ux", "r-rev-api", "r-rev-found", "r-qa-setup"]
body = "Merge, run all checks, smoke-test the new endpoints through next dev, announce."

